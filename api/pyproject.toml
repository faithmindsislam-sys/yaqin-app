[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yaqin-api"
version = "0.1.0"
description = "Yaqin learning API, tutor and scholarly review workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "PyJWT[crypto]==2.15.1",
    "cryptography==50.0.2",
    "asyncpg==0.31.0",
    "httpx==0.28.1",
    "boto3==1.43.107",
    "anthropic[bedrock]==1.11.0",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["runtime_safety: exercise real guardrail plumbing using offline SDK responses"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
