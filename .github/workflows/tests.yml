name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './api[dev]'
      - run: python -m pytest api/tests/scripts/test_deploy_api.py
      - run: python -m scripts.export_public_contracts --check
        working-directory: api
      - run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: python api/scripts/check_postgres.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run check:routing && npm run check:source-quotes && npm run check:courses
        working-directory: web
